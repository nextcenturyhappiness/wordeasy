<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="wordeasy app icon">
  <!--
    Context-card mark (DEC-038) on Apple-style macOS inset (DEC-034):
    visible squircle is 824×824 on a 1024 canvas (100px padding, ~80.5%).
    Geometry: indigo squircle, tilted white card, two pale lines, gold highlight.
    Do not full-bleed the squircle; corners outside it stay transparent.
  -->
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0b1024" flood-opacity="0.28" />
    </filter>
  </defs>
  <g transform="translate(100 100)">
    <rect width="824" height="824" rx="184" fill="#1E2A68" />
    <g transform="translate(412 412) rotate(-8)">
      <rect
        x="-188"
        y="-236"
        width="376"
        height="472"
        rx="42"
        fill="#ffffff"
        filter="url(#card-shadow)"
      />
      <path d="M-118 -132 h236" fill="none" stroke="#D7D3EA" stroke-width="16" stroke-linecap="round" />
      <path d="M-118 0 h236" fill="none" stroke="#C9A24A" stroke-width="40" stroke-linecap="round" />
      <path d="M-118 132 h236" fill="none" stroke="#D7D3EA" stroke-width="16" stroke-linecap="round" />
    </g>
  </g>
</svg>
