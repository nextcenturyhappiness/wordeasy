<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="wordeasy maskable app icon">
  <!--
    Full-bleed maskable source (DEC-034 / DEC-038): indigo fill to the edge.
    Same tilted context-card glyph, sized for the inner ~80% safe zone.
    Do not apply the macOS 100px inset here.
  -->
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1024" flood-opacity="0.28" />
    </filter>
  </defs>
  <rect width="512" height="512" fill="#1E2A68" />
  <g transform="translate(256 256) rotate(-8)">
    <rect
      x="-118"
      y="-148"
      width="236"
      height="296"
      rx="28"
      fill="#ffffff"
      filter="url(#card-shadow)"
    />
    <path d="M-74 -82 h148" fill="none" stroke="#D7D3EA" stroke-width="10" stroke-linecap="round" />
    <path d="M-74 0 h148" fill="none" stroke="#C9A24A" stroke-width="26" stroke-linecap="round" />
    <path d="M-74 82 h148" fill="none" stroke="#D7D3EA" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>
